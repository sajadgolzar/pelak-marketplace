plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.pelakauto.nativeapp'
    compileSdk 35

    defaultConfig {
        // Separate preview ID so the current WebView APK stays installed.
        applicationId 'com.pelakauto.nativepreview'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.4.1-native-preview'
        resConfigs 'fa', 'en', 'ar', 'ka'
        buildConfigField 'String', 'FIREBASE_APP_ID', '\"1:245022577031:android:8bc31b15733dba8ce58322\"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '\"AIzaSyBJWadEPLZdrwcnKI9sFk64IfvDfUed8Xo\"'
        buildConfigField 'String', 'FIREBASE_SENDER_ID', '\"245022577031\"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '\"pelak-ae9f3\"'
    }
    // Production signing material is injected by GitHub Actions secrets; never stored in Git.
    def signingPath = System.getenv('PELAK_SIGNING_STORE_FILE')
    def signingStorePass = System.getenv('PELAK_SIGNING_STORE_PASSWORD')
    def signingAlias = System.getenv('PELAK_SIGNING_KEY_ALIAS')
    def signingKeyPass = System.getenv('PELAK_SIGNING_KEY_PASSWORD')
    if (signingPath && signingStorePass && signingAlias && signingKeyPass) {
        signingConfigs {
            pelakRelease {
                storeFile file(signingPath)
                storePassword signingStorePass
                keyAlias signingAlias
                keyPassword signingKeyPass
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.pelakRelease
                minifyEnabled false
            }
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.55'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}


