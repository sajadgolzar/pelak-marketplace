name: Build PELAK Native Android Preview
on:
  push:
    branches:
      - main
      - feature/pelak-native-android-mvp-2026-11-12
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pelak-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile fully native Kotlin/Compose app
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        run: |
          set -euo pipefail
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-native/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-v0.1-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
