name: Publish PELAK Android 0.4.0 photo and listing update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-native-signed-account-release.yml'
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Successful one-time key-backup workflow run ID'
        required: true
        default: '43733615602'
permissions:
  contents: write
  actions: read
jobs:
  signed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7f3d48fad3dff06a088faa558fca762c3898962b
          path: native-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve original encrypted signing backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id || '43733615602' }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pelak-signing"
          gh run download "$BACKUP_RUN_ID" --repo "$GH_REPO" --name pelak-encrypted-signing-backup --dir "$RUNNER_TEMP/pelak-signing"
          test -s "$RUNNER_TEMP/pelak-signing/PELAK-android-release.jks.enc"
          test -s "$RUNNER_TEMP/pelak-signing/certificate-fingerprint.txt"
      - name: Decrypt key and validate original certificate
        env:
          BACKUP_PASSWORD: ${{ secrets.PELAK_ANDROID_BACKUP_PASSWORD }}
          PELAK_SIGNING_STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          PELAK_SIGNING_KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          PELAK_SIGNING_KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in BACKUP_PASSWORD PELAK_SIGNING_STORE_PASSWORD PELAK_SIGNING_KEY_ALIAS PELAK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/pelak-signing/PELAK-android-release.jks.enc" \
            -out "$RUNNER_TEMP/pelak-signing/release.jks" -pass env:BACKUP_PASSWORD
          keytool -list -v -keystore "$RUNNER_TEMP/pelak-signing/release.jks" \
            -storepass:env PELAK_SIGNING_STORE_PASSWORD \
            -alias "$PELAK_SIGNING_KEY_ALIAS" > "$RUNNER_TEMP/pelak-signing/key-info.txt"
          expected="$(grep -m1 'SHA256:' "$RUNNER_TEMP/pelak-signing/certificate-fingerprint.txt" | sed 's/^[[:space:]]*//')"
          actual="$(grep -m1 'SHA256:' "$RUNNER_TEMP/pelak-signing/key-info.txt" | sed 's/^[[:space:]]*//')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::Signing certificate differs from original encrypted backup"; exit 1
          fi
          echo "Original signing certificate verified."
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify signed release APK
        env:
          PELAK_SIGNING_STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          PELAK_SIGNING_KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          PELAK_SIGNING_KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PELAK_SIGNING_STORE_FILE="$RUNNER_TEMP/pelak-signing/release.jks"
          cd native-source/android-native
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/pelak-signing/apk-certificate.txt"
          normalize_digest() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          expected=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/pelak-signing/certificate-fingerprint.txt" | head -n1 | normalize_digest)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pelak-signing/apk-certificate.txt" | normalize_digest)
          test -n "$expected" && test "$expected" = "$actual"
          previous="$GITHUB_WORKSPACE/downloads/PELAK-Native-v0.3.3-preview.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$previous" > "$RUNNER_TEMP/pelak-signing/previous-certificate.txt"
          previous_digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pelak-signing/previous-certificate.txt" | normalize_digest)
          test "$previous_digest" = "$actual"
          previous_badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$previous")
          grep -F "package: name='com.pelakauto.nativepreview' versionCode='6'" <<< "$previous_badging"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -F "package: name='com.pelakauto.nativepreview' versionCode='7' versionName='0.4.0-native-preview'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then exit 1; fi
          icon_paths=$(sed -nE "s/^application-icon-[0-9]+:'([^']+)'$/\1/p" <<< "$badging" | sort -u)
          expected_densities=(160 240 320 480 640)
          for density in "${expected_densities[@]}"; do
            grep -Eq "^application-icon-$density:'.+\.png'$" <<< "$badging"
          done
          test "$(wc -l <<< "$icon_paths")" -eq 5
          while IFS= read -r icon; do unzip -p "$apk" "$icon" > /dev/null; done <<< "$icon_paths"
          mapfile -t source_hashes < <(for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do git hash-object "app/src/main/res/mipmap-$density/ic_launcher.png"; done)
          expected_hashes=(0a30320423441c954d5c7c978765418150042561 b097bca320698fb662073e4f4e9f4133c44e7192 47a7a7714b83896bfba25b1233b8e7bf5b18bec0 9604d83b9fba55d56fa69103d23de0e57f0f1bfa 1217bce95bcdbcbea9b4ff1320af90d97b548785)
          test "${source_hashes[*]}" = "${expected_hashes[*]}"
          unzip -p "$apk" assets/pelak-vehicle-catalog.json | cmp - app/src/main/assets/pelak-vehicle-catalog.json
          unzip -t "$apk" >/dev/null
          cp "$apk" "$RUNNER_TEMP/PELAK-Native-v0.4.0-preview.apk"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pelak-native-test-failures
          path: native-source/android-native/app/build/test-results/
          retention-days: 3
      - name: Erase plaintext signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pelak-signing/release.jks" "$RUNNER_TEMP/pelak-signing/key-info.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-signed-qa-apk
          path: ${{ runner.temp }}/PELAK-Native-v0.4.0-preview.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish signed Android preview
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-v0.4.0-preview
          name=PELAK-Native-v0.4.0-preview.apk
          apk="$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256")
          source_commit=$(git -C native-source rev-parse HEAD)
          gh release create "$tag" "$apk" "$apk.sha256" \
            --target "$source_commit" --prerelease --title 'PELAK Android 0.4.0 Preview' \
            --notes 'ویرایش عکس‌ها و اصلاح آپلود، گالری، جست‌وجو و ارسال برای بررسی.'

      - name: Publish the APK and its update metadata together
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          name=PELAK-Native-v0.4.0-preview.apk
          cp "$RUNNER_TEMP/$name" "downloads/$name"
          cp "$RUNNER_TEMP/$name" downloads/PELAK-Android-Latest.apk
          python3 - <<'PY'
          import json
          from pathlib import Path

          page = Path("android.html")
          html = page.read_text(encoding="utf-8")
          old_name = "PELAK-Native-v0.3.3-preview.apk"
          assert html.count(old_name) == 1 and html.count("۰٫۳٫۳") == 1
          page.write_text(html.replace(old_name, "PELAK-Native-v0.4.0-preview.apk")
                          .replace("۰٫۳٫۳", "۰٫۴٫۰"), encoding="utf-8")

          manifest = Path("pelak-release.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["android"].update(
              versionCode=7,
              versionName="0.4.0-native-preview",
              apkUrl="https://pelakauto.ir/downloads/PELAK-Native-v0.4.0-preview.apk",
              notes="ویرایش و جایگزینی عکس‌ها، اصلاح جهت تصویر و آپلود ۸ عکس، گالری روان‌تر، انتخاب مدل و تیپ و جست‌وجوی کامل.",
          )
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android.html pelak-release.json "downloads/$name" downloads/PELAK-Android-Latest.apk
          git commit -m 'release(web): publish signed Android 0.4.0 and in-app updates'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
