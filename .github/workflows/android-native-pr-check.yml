name: Check PELAK Native Android PR
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-pr-check.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile native Android debug APK
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK archive
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-native/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-pr-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
