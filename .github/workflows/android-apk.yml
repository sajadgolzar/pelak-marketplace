name: Legacy PELAK WebView APK (manual maintenance only)
on:
  workflow_dispatch:
concurrency:
  group: pelak-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current PELAK website repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35 using preinstalled SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        env:
          PELAK_FIREBASE_APP_ID: ${{ secrets.PELAK_FIREBASE_APP_ID }}
          PELAK_FIREBASE_API_KEY: ${{ secrets.PELAK_FIREBASE_API_KEY }}
          PELAK_FIREBASE_SENDER_ID: ${{ secrets.PELAK_FIREBASE_SENDER_ID }}
          PELAK_FIREBASE_PROJECT_ID: ${{ secrets.PELAK_FIREBASE_PROJECT_ID }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify built APK before publishing
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Eq 'classes([0-9]+)?[.]dex'

      - name: Publish installation APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: pelak-android-v0.3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

