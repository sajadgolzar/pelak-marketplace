name: PELAK local font preparation and regression
on:
  push:
    branches: [fix/local-persian-font-20261128]
    paths: ['.github/workflows/local-font-qa.yml','scripts/local_font_migration.py','pelak-font.css']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OFL font and validate exact upstream bytes
        run: |
          set -euo pipefail
          mkdir -p fonts
          root='https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7'
          curl -fL --retry 3 --max-time 45 "$root/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2" -o fonts/Vazirmatn-variable.woff2
          curl -fL --retry 3 --max-time 45 "$root/OFL.txt" -o fonts/OFL.txt
          test "$(git hash-object fonts/Vazirmatn-variable.woff2)" = a501289a85595158570b0c2badcb4608b042e748
          grep -Fq 'SIL OPEN FONT LICENSE Version 1.1' fonts/OFL.txt
          test "$(head -c 4 fonts/Vazirmatn-variable.woff2)" = wOF2
      - name: Apply typography-only migration
        run: python3 scripts/local_font_migration.py
      - name: Verify pages, font and existing functional tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[Path(x) for x in ('index.html','admin.html','android.html','car-price.html')]
          for d in ('about','ads','buying-guides','car-guide','comparisons','guides','import-cost','prices'):
              paths.extend(Path(d).rglob('index.html'))
          for p in paths:
              s=p.read_text()
              assert 'fonts.googleapis.com' not in s and 'fonts.gstatic.com' not in s, p
              assert '/pelak-font.css?v=1' in s, p
          assert 'var(--pelak-persian-font)' in Path('discovery.css').read_text()
          assert 'font-weight: 100 900' in Path('pelak-font.css').read_text()
          print(len(paths), 'live HTML pages verified')
          PY
          node --check pelak-sw.js
          node --test tests/listing-guidance.test.mjs tests/native-photo-relay.test.mjs
      - name: Verify font rendering in mobile WebKit
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pelak-font-test" playwright
          "$RUNNER_TEMP/pelak-font-test/node_modules/.bin/playwright" install --with-deps webkit
          python3 -m http.server 8765 > "$RUNNER_TEMP/font-server.log" 2>&1 &
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/pelak-font.css >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/pelak-font-test/node_modules" node <<'JS'
          const {webkit}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            try {
              const fs=require('node:fs');
              const paths=['/','/admin.html','/android.html','/car-price.html'];
              for(const dir of ['about','ads','buying-guides','car-guide','comparisons','guides','import-cost','prices']){
                for(const file of fs.readdirSync(dir,{recursive:true}).map(String)){
                  if(file==='index.html'||file.endsWith('/index.html')) paths.push('/'+dir+'/'+file.replace(/index\.html$/,''));
                }
              }
              if(paths.length!==31)throw Error('Incorrect page count: '+paths.length);
              for(const path of paths){
                const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,serviceWorkers:'block'});
                try{
                  await page.route('**/*',route=>route.request().url().startsWith('http://127.0.0.1:8765/')?route.continue():route.abort());
                  const response=await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'load'});
                  if(!response?.ok()) throw Error(path+' HTTP '+response?.status());
                  await page.waitForFunction(()=>getComputedStyle(document.body).fontFamily.includes('Vazirmatn'),{},{timeout:10000});
                  const check=await page.evaluate(async()=>{
                    const regular=await document.fonts.load('400 16px Vazirmatn','پلاک');
                    const bold=await document.fonts.load('700 26px Vazirmatn','پلاک');
                    await document.fonts.ready;
                    return {family:getComputedStyle(document.body).fontFamily,loaded:regular.length>0&&bold.length>0&&regular.every(f=>f.status==='loaded')&&bold.every(f=>f.status==='loaded')};
                  });
                  if(!check.loaded||!check.family.includes('Vazirmatn'))throw Error(path+' '+JSON.stringify(check));
                  console.log(path,check.family,'loaded');
                }finally{await page.close()}
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Show local server diagnostics on failure
        if: failure()
        run: cat "$RUNNER_TEMP/font-server.log" || true
      - name: Commit verified assets on isolated branch
        run: |
          set -euo pipefail
          git add fonts pelak-font.css index.html admin.html android.html car-price.html discovery.css pelak-car-price.css about ads buying-guides car-guide comparisons guides import-cost prices scripts/build_discovery.py pelak-public-ads.mjs pelak-sw.js
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Use verified self-hosted Vazirmatn on all active web pages"
          git push origin HEAD:fix/local-persian-font-20261128
