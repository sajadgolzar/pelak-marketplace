name: Host PELAK native APK on website
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-native-apk-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-account-menu-20261115
          path: native-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build native branded APK
        working-directory: native-source/android-native
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate APK and branding
        run: |
          set -euo pipefail
          test -s native-source/android-native/app/build/outputs/apk/debug/app-debug.apk
          grep -q 'android:label="پلاک"' native-source/android-native/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/pelak_launcher"' native-source/android-native/app/src/main/AndroidManifest.xml
          unzip -t native-source/android-native/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: true
      - name: Publish APK on both website domains
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          cp native-source/android-native/app/build/outputs/apk/debug/app-debug.apk site/downloads/PELAK-Android-Latest.apk
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/PELAK-Android-Latest.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release(android): host latest native branded APK on website'
          git push origin HEAD:main
