name: Host PELAK native APK on website
# QA build: vector icon, SMS coming-soon, settings, and native v0.3.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-native-apk-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-account-menu-20261115
          path: native-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build native branded APK
        working-directory: native-source/android-native
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate APK and branding
        run: |
          set -euo pipefail
          test -s native-source/android-native/app/build/outputs/apk/debug/app-debug.apk
          grep -q 'android:label="پلاک"' native-source/android-native/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/pelak_launcher"' native-source/android-native/app/src/main/AndroidManifest.xml
          unzip -t native-source/android-native/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      # Never publish an ephemeral debug-signed APK as an in-place update.
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-qa-debug-apk
          path: native-source/android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
