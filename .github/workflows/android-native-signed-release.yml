name: Build signed PELAK Android release (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-account-menu-20261115
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require configured release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.PELAK_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing release signing secret: $v"; exit 1; fi
          done
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble APK with persistent release key
        env:
          KEYSTORE_B64: ${{ secrets.PELAK_ANDROID_KEYSTORE_B64 }}
          PELAK_SIGNING_STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          PELAK_SIGNING_KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          PELAK_SIGNING_KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/pelak-release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pelak-release.keystore"
          export PELAK_SIGNING_STORE_FILE="$RUNNER_TEMP/pelak-release.keystore"
          cd android-native
          gradle :app:assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$RUNNER_TEMP/PELAK-Native-signed-release.apk"
      - name: Validate release package and version
        run: |
          set -euo pipefail
          grep -q "versionCode 3" android-native/app/build.gradle
          grep -q "versionName '0.3-native-preview'" android-native/app/build.gradle
          grep -q 'android:label="پلاک"' android-native/app/src/main/AndroidManifest.xml
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/PELAK-Native-signed-release.apk" | grep -E "package:|application-label:"
      - name: Upload signed APK for manual device QA
        uses: actions/upload-artifact@v4
        with:
          name: pelak-native-signed-release-apk
          path: ${{ runner.temp }}/PELAK-Native-signed-release.apk
          retention-days: 30
          if-no-files-found: error
