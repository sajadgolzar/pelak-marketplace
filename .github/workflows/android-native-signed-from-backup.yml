name: Build signed PELAK APK from encrypted backup (manual QA)
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Successful one-time key-backup workflow run ID'
        required: true
        default: '43733615602'
permissions:
  contents: read
  actions: read
jobs:
  signed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve original encrypted signing backup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pelak-signing"
          gh run download "$BACKUP_RUN_ID" --repo "$GH_REPO" --name pelak-encrypted-signing-backup --dir "$RUNNER_TEMP/pelak-signing"
          test -s "$RUNNER_TEMP/pelak-signing/PELAK-android-release.jks.enc"
          test -s "$RUNNER_TEMP/pelak-signing/certificate-fingerprint.txt"
      - name: Decrypt key and validate original certificate
        env:
          BACKUP_PASSWORD: ${{ secrets.PELAK_ANDROID_BACKUP_PASSWORD }}
          PELAK_SIGNING_STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          PELAK_SIGNING_KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          PELAK_SIGNING_KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in BACKUP_PASSWORD PELAK_SIGNING_STORE_PASSWORD PELAK_SIGNING_KEY_ALIAS PELAK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/pelak-signing/PELAK-android-release.jks.enc" \
            -out "$RUNNER_TEMP/pelak-signing/release.jks" -pass env:BACKUP_PASSWORD
          keytool -list -v -keystore "$RUNNER_TEMP/pelak-signing/release.jks" \
            -storepass:env PELAK_SIGNING_STORE_PASSWORD \
            -alias "$PELAK_SIGNING_KEY_ALIAS" > "$RUNNER_TEMP/pelak-signing/key-info.txt"
          expected="$(grep -m1 'SHA256:' "$RUNNER_TEMP/pelak-signing/certificate-fingerprint.txt" | sed 's/^[[:space:]]*//')"
          actual="$(grep -m1 'SHA256:' "$RUNNER_TEMP/pelak-signing/key-info.txt" | sed 's/^[[:space:]]*//')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::Signing certificate differs from original encrypted backup"; exit 1
          fi
          echo "Original signing certificate verified."
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify signed release APK
        env:
          PELAK_SIGNING_STORE_PASSWORD: ${{ secrets.PELAK_ANDROID_STORE_PASSWORD }}
          PELAK_SIGNING_KEY_ALIAS: ${{ secrets.PELAK_ANDROID_KEY_ALIAS }}
          PELAK_SIGNING_KEY_PASSWORD: ${{ secrets.PELAK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PELAK_SIGNING_STORE_FILE="$RUNNER_TEMP/pelak-signing/release.jks"
          cd android-native
          gradle :app:assembleRelease --no-daemon
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/pelak-signing/apk-certificate.txt"
          unzip -t "$apk" >/dev/null
          cp "$apk" "$RUNNER_TEMP/PELAK-Native-signed-QA.apk"
      - name: Erase plaintext signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pelak-signing/release.jks" "$RUNNER_TEMP/pelak-signing/key-info.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-signed-qa-apk
          path: ${{ runner.temp }}/PELAK-Native-signed-QA.apk
          retention-days: 7
          if-no-files-found: error
