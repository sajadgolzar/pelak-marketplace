name: PELAK photo transport regression QA (no publication)
on:
  push:
    branches: [fix/native-upload-reconcile-20261128, native-0.4.8-photo-fix]
    paths: ['.github/workflows/native-upload-regression.yml', 'android-native/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 114936401f3dcb98f90bdb605d9bb8fbda42b144
          path: relay-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test restricted relay
        run: node --test relay-source/tests/native-photo-relay.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify the exact 512px PELAK website logo is bundled
        run: |
          python - <<'PY'
          import hashlib, struct
          from pathlib import Path
          web = Path('relay-source/pelak-icon-512.png').read_bytes()
          app = Path('android-native/app/src/main/res/mipmap-nodpi/ic_launcher.png').read_bytes()
          assert web == app, 'Android logo differs from original website PNG'
          assert struct.unpack('>II', app[16:24]) == (512, 512), 'Logo source must be 512x512'
          print('Verified exact 512px source', hashlib.sha256(app).hexdigest())
          PY
      - name: Run Android regression tests and compile
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-regression-test-reports
          path: android-native/app/build/test-results/
          retention-days: 7
      - name: Validate debug APK archive
        run: unzip -t android-native/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: pelak-native-048-qa-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
