plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pelakauto.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pelakauto.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        resConfigs 'fa', 'en'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
}
