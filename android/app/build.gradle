plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pelakauto.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.pelakauto.app'
        // Public Firebase Android client identifiers. CI secrets can override these defaults.
        // Never put a Firebase service-account key or Supabase secret in the APK.
        buildConfigField 'String', 'FIREBASE_APP_ID', '"' + (System.getenv('PELAK_FIREBASE_APP_ID') ?: '1:245022577031:android:8bc31b15733dba8ce58322') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (System.getenv('PELAK_FIREBASE_API_KEY') ?: 'AIzaSyBJWadEPLZdrwcnKI9sFk64IfvDfUed8Xo') + '"'
        buildConfigField 'String', 'FIREBASE_SENDER_ID', '"' + (System.getenv('PELAK_FIREBASE_SENDER_ID') ?: '245022577031') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + (System.getenv('PELAK_FIREBASE_PROJECT_ID') ?: 'pelak-ae9f3') + '"'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        resConfigs 'fa', 'en'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
